# 注目度(YouTube再生数)の日次ローリング更新。
# 無料枠(約95組/日)ぶんだけ取得し、未取得を優先しつつ全組を約2週間周期で更新する。
# data/ へのコミットで deploy.yml が発火し、サイトにも自動反映される。
name: Update popularity

on:
  schedule:
    # 毎日 18:00 JST (09:00 UTC)。APIクォータは日本時間16時頃にリセットされる
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-popularity
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Fetch popularity
        working-directory: scraper
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "YOUTUBE_API_KEY未設定のためスキップ"
            exit 0
          fi
          uv sync
          uv run m1 fetch-popularity
          uv run m1 build
      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scraper/work/popularity.json data/popularity.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "注目度データ自動更新 ($(date +%Y-%m-%d))"
            git pull --rebase origin main
            git push
          fi
