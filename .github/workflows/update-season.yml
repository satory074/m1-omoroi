# シーズン中(8〜12月)の週次差分更新。
# 2026年出場コンビの最新ステータスを走査し、変化したコンビだけ詳細を再取得して data/ を更新する。
name: Update season data

on:
  schedule:
    # 月曜 21:00 JST (12:00 UTC)。8〜12月のみ
    - cron: '0 12 * 8-12 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Crawl season diff
        working-directory: scraper
        run: |
          # チェックアウト直後は cache/combi が空。再取得が0件のまま parse-combi を
          # 呼ぶと「キャッシュがありません」で exit 1 するため、取得済みがある時だけ回す。
          # (前回実行から変化が無い週は両パスとも0件になり得る)
          parse_if_crawled() {
            if [ -n "$(ls -A cache/combi 2>/dev/null)" ]; then
              uv run m1 parse-combi
            else
              echo "再取得0件のため parse-combi をスキップ(正本 combi.jsonl.gz をそのまま使う)"
            fi
          }
          uv sync
          uv run m1 crawl-list --year 2026 --refresh --detect-changed
          uv run python -c "
          import json, pathlib
          changed = json.loads(pathlib.Path('work/changed_2026.json').read_text())
          print(f'{len(changed)}組が更新対象')
          "
          uv run m1 crawl-combi --ids work/changed_2026.json --force
          # 変化したコンビだけ再取得し、コミット済みの正本(combi.jsonl.gz)にマージする
          parse_if_crawled
          # list.php は詳細ページより先に更新されるため、detect-changed(list文字列の変化)
          # だけでは『list が確定 → 後から詳細が確定』の組を取りこぼす。list が確定結果を
          # 示すのに詳細が追随漏れの組を第2パスで回収し、再取得→再パースする
          # (第1パスをスキップした場合 detect-stale は正本 .gz を読むので問題ない)
          uv run m1 detect-stale --year 2026
          uv run m1 crawl-combi --ids work/stale_2026.json --force
          parse_if_crawled
          # 注目度は update-popularity.yml が日次で更新するためここでは取得しない
          uv run m1 build
      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data scraper/state scraper/work/combi.jsonl.gz scraper/work/popularity.json
          # build は data/meta.json 等も再生成する。未stageの再生成物が残ると
          # 後続の git pull --rebase が「unstaged changes」で失敗するため破棄する
          git checkout -- .
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "シーズンデータ自動更新 ($(date +%Y-%m-%d))"
            # クロールに約50分かかるため、その間に update-popularity.yml が
            # push しているとそのままでは reject され、取得結果が丸ごと失われる
            git pull --rebase origin main
            git push
          fi
